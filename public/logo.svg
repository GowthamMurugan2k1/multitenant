<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="80" fill="url(#gradient)" />
  <!-- Orbit Ring (dashed circle) -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="white" stroke-width="10" stroke-dasharray="15,15" />
  <!-- Text -->
  <text x="100" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white" font-weight="bold">
    TaskOrbit
  </text>
</svg>
